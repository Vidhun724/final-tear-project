<!DOCTYPE html>
<html>
<head>
<title>Security AI Assistant</title>

<style>

body{
    margin:0;
    height:100vh;
    font-family:Segoe UI;
    background: url("{{ url_for('static', filename='images/about_bar.jpg') }}");
    background-size: cover;
    background-position: center;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* MAIN CARD */
.container{
    width:520px;
    height:650px;
    display:flex;
    flex-direction:column;
    background: rgba(255,255,255,0.06);
    border-radius:20px;
    backdrop-filter: blur(15px);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 40px rgba(139,92,246,0.3);
    overflow:hidden;
    animation:fadeIn 1s ease;
}

/* HEADER */
.header{
    padding:15px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.header h1{
    margin:0;
    font-size:20px;
    text-shadow:0 0 10px rgba(139,92,246,0.6);
}

.subtitle{
    font-size:12px;
    color:#cbd5f5;
}

/* THREAT BOX */
.threat-box{
    padding:12px 15px;
    background: rgba(139,92,246,0.12);
    border-left:4px solid #8b5cf6;
    border-radius:10px;
    font-size:13px;
    text-align:left;
    margin:10px;
}

.threat-box p{
    margin:6px 0;
    color:#e0e7ff;
}

/* CHAT AREA */
#chat-box{
    flex:1;
    overflow-y:auto;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

/* AI MESSAGE (THEME FIXED) */
.message{
    align-self:flex-start;
    background: rgba(139,92,246,0.15);
    color:#e0e7ff;
    padding:10px;
    border-radius:12px;
    max-width:70%;
    font-size:13px;
    border:1px solid rgba(139,92,246,0.3);
    backdrop-filter: blur(5px);
}

/* USER MESSAGE */
.use{
    align-self:flex-end;
    background: linear-gradient(to right, #3b82f6, #8b5cf6);
    color:white;
    padding:10px;
    border-radius:12px;
    max-width:70%;
    font-size:13px;
}

/* INPUT BAR */
.input-area{
    display:flex;
    padding:10px;
    border-top:1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2);
}

#user-input{
    flex:1;
    padding:10px;
    border-radius:20px;
    border:1px solid rgba(139,92,246,0.3);
    background: rgba(255,255,255,0.08);
    color:white;
    outline:none;
}

#user-input:focus{
    box-shadow:0 0 10px rgba(139,92,246,0.6);
}

button{
    margin-left:5px;
    padding:10px 15px;
    border:none;
    border-radius:50%;
    background: linear-gradient(to right, #3b82f6, #8b5cf6);
    color:white;
    cursor:pointer;
}

/* FOOTER */
.footer{
    text-align:center;
    padding:10px;
}

.b_button{
      display:inline-block;
        margin-top:30px;
        padding:12px 22px;
        border-radius:12px;
        text-decoration:none;
        background:#38bdf8;
        color:black;
        font-weight:bold;
        transition:0.3s;
}

.b_button:hover{
        background:#0ea5e9;
        transform:scale(1.05);
       
}

.sent{
    display:inline-block;
    font-weight:bold;
    transition:0.3s;
}

.sent:hover{
    color:#0ea5e9;
    transform:scale(1.1);
}

@keyframes fadeIn{
        from{opacity:0; transform:translateY(20px);}
        to{opacity:1; transform:translateY(0);}
 }

</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">
    <h1>🤖 Security AI Assistant</h1>
    <div class="subtitle">Real-time Threat Intelligence</div>
</div>

<!-- THREAT -->
<div class="threat-box">
   <center> 
    <p>⚠️ <b>Attack Type:</b> {{ attack }}</p>
    <p>🔥 <b>Severity:</b> {{ severity }}</p>
    <p>📄 <b>Evidence:</b> {{ evidence }}</p>
    </center>
</div>

<!-- CHAT -->
<div id="chat-box">
    <div class="message">Hello! 👋 How can I help?</div>
</div>

<!-- INPUT -->
<div class="input-area">
    <input type="text" id="user-input" placeholder="Ask something...">
    <button class=sent onclick="sendMessage()">➤</button>
</div>

<!-- FOOTER -->
<div class="footer">
    <a href="/Dashboard" class="b_button">Back to Dashboard</a>
</div>

</div>

<script>

// SEND MESSAGE
async function sendMessage(){

    let input = document.getElementById("user-input")
    let message = input.value
    if(message.trim() === "") return

    let chatBox = document.getElementById("chat-box")

    let userMsg = document.createElement("div")
    userMsg.className = "use"
    userMsg.innerText = message
    chatBox.appendChild(userMsg)

    let aiMsg = document.createElement("div")
    aiMsg.className = "message"
    aiMsg.innerText = "Thinking..."
    chatBox.appendChild(aiMsg)

    input.value = ""
    chatBox.scrollTop = chatBox.scrollHeight

    const response = await fetch("/chat", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message:message})
    })

    const data = await response.json()
    aiMsg.innerText = data.reply

    chatBox.scrollTop = chatBox.scrollHeight
}


// AUTO EXPLAIN
window.onload = async function () {

    const attack = "{{ attack }}"
    if (!attack) return

    let chatBox = document.getElementById("chat-box")

    let aiMsg = document.createElement("div")
    aiMsg.className = "message"
    aiMsg.innerText = "Analyzing detected threat..."
    chatBox.appendChild(aiMsg)

    const response = await fetch("/auto_explain", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            attack:"{{ attack }}",
            severity:"{{ severity }}",
            evidence:"{{ evidence }}"
        })
    })

    const data = await response.json()
    aiMsg.innerText = data.reply
}

</script>

</body>
</html>
